[project]
name = "abm-kernel"
version = "0.1.0"
description = "Auto-ABM standardized ABM kernel (Mesa wrapper)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mesa>=3.0.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
]

[project.scripts]
abm-kernel-worker = "abm_kernel.worker:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abm_kernel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["abm_kernel"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mesa", "mesa.*", "networkx", "networkx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "abm_kernel.base"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
